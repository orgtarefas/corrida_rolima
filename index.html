<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrida 3D</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial; }
        #info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
            font-size: 14px;
        }
        #velocimetro {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: #00ff00;
            background: rgba(0,0,0,0.8);
            padding: 15px 25px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 24px;
            font-weight: bold;
            z-index: 100;
            border: 2px solid #00ff00;
        }
        .loading {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="info">
        🎮 WASD ou Setas para dirigir | Espaço para drift
    </div>
    <div id="velocimetro">
        0 km/h
    </div>
    <div id="loading" class="loading">
        Carregando...
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="script.js"></script>
</body>
</html>
